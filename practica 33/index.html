<!doctype html>
<html lang="es">
<head>
	<meta charset="utf-8">
	<title>corredores maraton</title>
</head>
<body>
	<div id="contenedor">
		<header>
			<h1>Bienvenidos corredores!</h1>
		</header>
		<main>
			<h2>Por favor, complete el siguiente formulario</h2>
			<section>
				<form id= "formCorredores" action="#" method="get">
					 <fieldset>
                    <legend>Datos personales</legend>
                    <label for="nombre">Nombre: *</label>
                    <input type="text" name="nombre" id="nombre" required>
                    <label for="apellido">Apellido: *</label>
                    <input type="text" name="apellido" id="apellido" required>
                    <label for="dni">DNI:</label>
                    <input type="number" name="dni" id="dni">
                    <label for="edad">Edad:</label>
                    <input type="number" name="edad" id="edad">
                    <label for="numero">Número de participante:</label>
                    <input type="number" name="numero" id="numero">
                    <label for="tiempo">Tiempo de carrera:</label>
                    <input type="number" name="tiempo" id="tiempo">
                </fieldset>
                  <button type="submit">Enviar</button>
                <button type="reset">Borrar</button>
				</form>
			</section>
		</main>
		<footer>
			
		</footer>
	</div>
	<script src="js/java.js"></script>
</body>
</html>
